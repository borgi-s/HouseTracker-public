[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "housetracker"
version = "0.1.0"
description = "House-hunting tracker: capture listings, score visits together, enrich with Danish public data"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
scrape = ["patchright>=1.0", "beautifulsoup4>=4.12", "pypdf>=4.0"]
api = ["fastapi>=0.115", "uvicorn>=0.30", "python-multipart>=0.0.9"]

[tool.setuptools.packages.find]
include = ["housetracker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
